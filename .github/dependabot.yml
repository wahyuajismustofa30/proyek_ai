version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: main
    labels: [dependencies, python]
    commit-message:
      prefix: "ci"
      include: scope

# Project-specific ecosystems are added when a project with the matching
# manifest exists under /projects. Avoid /projects/* here: Dependabot reports
# dependency_file_not_found when the glob has no matching project directories.
