      day: monday
      time: "02:30"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 15
    target-branch: main
    labels: [dependencies, javascript]
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

