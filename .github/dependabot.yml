version: 2
updates:
  # Satu-satunya ecosystem dependency yang benar-benar digunakan repository
  # saat ini adalah GitHub Actions. Dependency aplikasi ditambahkan ketika
  # manifest/lockfile proyek sudah tersedia.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
