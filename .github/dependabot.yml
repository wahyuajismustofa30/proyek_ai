version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: main
    labels: [dependencies, python]
    commit-message:
      prefix: "ci"
      include: scope

  - package-ecosystem: npm
    directories: ["/projects/*"]
    schedule:
