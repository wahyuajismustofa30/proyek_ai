version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: main
    labels: [dependencies, python]
    commit-message:
      prefix: "ci"
      include: scope

  - package-ecosystem: npm
    directories:
      - "/projects/*"
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 15
    target-branch: main
    labels: [dependencies, javascript]
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories:
      - "/projects/*"
    schedule:
      interval: weekly
      day: monday
      time: "02:45"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 15
    target-branch: main
    labels: [dependencies, python]
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: composer
    directories:
      - "/projects/*"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 15
    target-branch: main
    labels: [dependencies, php]
    commit-message:
      prefix: "deps"
      include: scope
