version: 2
updates:
  # Repository-level tooling that is actually present at the repository root.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Root Python validation tools: requirements-ci.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: main
    labels: [dependencies, python]
    commit-message:
      prefix: "ci"
      include: scope

# Project adapters currently supported by project-matrix.yml:
#   node   -> npm      -> package.json (requires package-lock.json in CI)
#   python -> pip      -> pyproject.toml and/or requirements*.txt
#   php    -> composer -> composer.json (requires composer.lock in CI)
#
# Add a concrete Dependabot directory entry for an ecosystem only when a
# project with its matching manifest exists under projects/<slug>/. Do not
# configure /projects/* while projects/ has no matching project: Dependabot
# would report dependency_file_not_found for a directory with no manifest.
# Keep this list synchronized with the real project directories and CI adapters.
