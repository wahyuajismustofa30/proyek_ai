name: Monorepo project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: monorepo-project-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover projects and stacks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Discover project matrix
        id: discover
        run: python scripts/discover_projects.py --github-output "$GITHUB_OUTPUT"

  project-tests:
    name: ${{ matrix.project }} / ${{ matrix.stack }}
    needs: discover
    if: ${{ needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: ${{ matrix.stack == 'node' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install Node.js dependencies
        if: ${{ matrix.stack == 'node' }}
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail
          test -f package-lock.json || { echo "Commit package-lock.json for reproducible CI."; exit 1; }
          npm ci
      - name: Run Node.js checks
        if: ${{ matrix.stack == 'node' }}
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if (!p.scripts?.test) { console.error('Define a test script in package.json'); process.exit(1) }"
          npm run lint --if-present
          npm test
          npm run build --if-present

      - name: Set up Python
        if: ${{ matrix.stack == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        if: ${{ matrix.stack == 'python' }}
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f pyproject.toml ]]; then python -m pip install -e .; fi
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          if [[ -f requirements-test.txt ]]; then
            python -m pip install -r requirements-test.txt
          elif [[ -f requirements-dev.txt ]]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install pytest==8.4.2
          fi
      - name: Run Python tests
        if: ${{ matrix.stack == 'python' }}
        working-directory: ${{ matrix.project }}
        run: python -m pytest

      - name: Set up PHP
        if: ${{ matrix.stack == 'php' }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer
      - name: Install PHP dependencies
        if: ${{ matrix.stack == 'php' }}
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail
          test -f composer.lock || { echo "Commit composer.lock for reproducible CI."; exit 1; }
          composer validate --strict
          composer install --no-interaction --prefer-dist
      - name: Run PHP tests
        if: ${{ matrix.stack == 'php' }}
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail
          composer run-script --list | grep -qE '(^|[[:space:]])test([[:space:]]|$)' || {
            echo "Define a Composer test script before enabling PHP CI."
            exit 1
          }
          composer run-script test --no-interaction

      - name: Smoke-test static website
        if: ${{ matrix.stack == 'static' }}
        run: python scripts/check_static_site.py "${{ matrix.project }}"

      - name: Report project without an automated adapter
        if: ${{ matrix.stack == 'none' }}
        env:
          PROJECT_PATH: ${{ matrix.project }}
        run: echo "::notice::$PROJECT_PATH was discovered; no application test adapter is configured yet."
  web-validation:
    name: HTML, CSS, and project assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install --requirement requirements-ci.txt
      - name: Validate HTML, CSS, and local assets
        run: python scripts/validate_web_projects.py

  project-ci:
    name: Project matrix tests
    if: always()
    needs: [discover, project-tests, web-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Require application and web validation to pass
        env:
          PROJECT_TEST_RESULT: ${{ needs.project-tests.result }}
          WEB_VALIDATION_RESULT: ${{ needs.web-validation.result }}
          DISCOVERY_RESULT: ${{ needs.discover.result }}
        run: |
          if [[ "$DISCOVERY_RESULT" != "success" || "$PROJECT_TEST_RESULT" != "success" || "$WEB_VALIDATION_RESULT" != "success" ]]; then
            echo "Project validation failed: discovery=$DISCOVERY_RESULT application=$PROJECT_TEST_RESULT web=$WEB_VALIDATION_RESULT"
            exit 1
          fi
