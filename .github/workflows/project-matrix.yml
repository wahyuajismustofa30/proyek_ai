name: Monorepo project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: monorepo-project-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover projects and stacks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Discover project matrix
        id: discover
        run: python scripts/discover_projects.py --github-output "$GITHUB_OUTPUT"

  project-tests:
    name: ${{ matrix.project }} / ${{ matrix.stack }}
    needs: discover
    if: ${{ needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: ${{ matrix.stack == 'node' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run available Node.js checks
        if: ${{ matrix.stack == 'node' }}
        run: python scripts/run_project_checks.py node "${{ matrix.project }}"

      - name: Set up Python
        if: ${{ matrix.stack == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run available Python checks
        if: ${{ matrix.stack == 'python' }}
        run: python scripts/run_project_checks.py python "${{ matrix.project }}"

      - name: Set up PHP
        if: ${{ matrix.stack == 'php' }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer
      - name: Run available PHP checks
        if: ${{ matrix.stack == 'php' }}
        run: python scripts/run_project_checks.py php "${{ matrix.project }}"

      - name: Smoke-test static website
        if: ${{ matrix.stack == 'static' }}
        run: python scripts/check_static_site.py "${{ matrix.project }}" --entrypoint "${{ matrix.entrypoint }}"

      - name: Report project without an automated adapter
        if: ${{ matrix.stack == 'none' }}
        env:
          PROJECT_PATH: ${{ matrix.project }}
        run: echo "::notice::$PROJECT_PATH was discovered; no application test adapter is configured yet."
  web-validation:
    name: HTML, CSS, and project assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install --requirement requirements-ci.txt
      - name: Validate HTML, CSS, and local assets
        run: python scripts/validate_web_projects.py

  project-ci:
    name: Project matrix tests
    if: always()
    needs: [discover, project-tests, web-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Require application and web validation to pass
        env:
          PROJECT_TEST_RESULT: ${{ needs.project-tests.result }}
          WEB_VALIDATION_RESULT: ${{ needs.web-validation.result }}
          DISCOVERY_RESULT: ${{ needs.discover.result }}
        run: |
          if [[ "$DISCOVERY_RESULT" != "success" || "$PROJECT_TEST_RESULT" != "success" || "$WEB_VALIDATION_RESULT" != "success" ]]; then
            echo "Project validation failed: discovery=$DISCOVERY_RESULT application=$PROJECT_TEST_RESULT web=$WEB_VALIDATION_RESULT"
            exit 1
          fi
