name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate JSON, Python, Markdown, links, and whitespace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install CI Python dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate Dependabot YAML syntax and v2 schema
        run: npx --yes @bugron/validate-dependabot-yaml@0.3.3 .github/dependabot.yml

      - name: Validate changed JSON files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -d '' files < <(git diff --name-only -z "$PR_BASE_SHA...$HEAD_SHA" -- '*.json')
          elif [[ "$EVENT_NAME" == "push" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            mapfile -d '' files < <(git diff --name-only -z "$BEFORE_SHA" "$HEAD_SHA" -- '*.json')
          else
            mapfile -d '' files < <(git ls-files -z '*.json')
          fi
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            echo "Checking $file"
            python -m json.tool "$file" > /dev/null
          done
          echo "Validated ${#files[@]} changed JSON file(s)."

      - name: Compile Python files
        run: python -m compileall -q scripts

      - name: Verify generated project index
        run: python scripts/update_project_index.py --check

      - name: Run repository unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Lint changed Markdown files
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only -z "$PR_BASE_SHA...$HEAD_SHA" -- '*.md')
          if (("${#files[@]}" == 0)); then
            echo "No Markdown files changed; lint skipped."
          else
            npx --yes markdownlint-cli2@0.18.1 "${files[@]}"
          fi

      - name: Lint all Markdown files
        if: ${{ github.event_name != 'pull_request' }}
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"

      - name: Validate internal Markdown links
        if: ${{ github.event_name != 'pull_request' }}
        run: python scripts/check_internal_links.py

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Check whitespace errors in changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          case "$EVENT_NAME" in
            pull_request)
              git diff --check "$PR_BASE_SHA...$HEAD_SHA"
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                git diff --check "$empty_tree" "$HEAD_SHA"
              else
                git diff --check "$BEFORE_SHA" "$HEAD_SHA"
              fi
              ;;
            *)
              if git rev-parse "$HEAD_SHA^" >/dev/null 2>&1; then
                git diff --check "$HEAD_SHA^" "$HEAD_SHA"
              else
                git diff --check "$empty_tree" "$HEAD_SHA"
              fi
              ;;
          esac
