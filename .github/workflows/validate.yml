name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON, Python, and whitespace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            python -m json.tool "$file" > /dev/null
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)

      - name: Compile Python files
        run: python -m compileall -q projects templates

      - name: Check whitespace errors in changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          empty_tree="$(git hash-object -t tree /dev/null)"

          case "$EVENT_NAME" in
            pull_request)
              echo "Checking pull request changes against $PR_BASE_SHA"
              git diff --check "$PR_BASE_SHA...$HEAD_SHA"
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                echo "Initial push: checking all tracked files"
                git diff --check "$empty_tree" "$HEAD_SHA"
              else
                echo "Checking pushed changes from $BEFORE_SHA to $HEAD_SHA"
                git diff --check "$BEFORE_SHA" "$HEAD_SHA"
              fi
              ;;
            *)
              if git rev-parse "$HEAD_SHA^" >/dev/null 2>&1; then
                echo "Manual run: checking the latest commit"
                git diff --check "$HEAD_SHA^" "$HEAD_SHA"
              else
                echo "No parent commit: checking all tracked files"
                git diff --check "$empty_tree" "$HEAD_SHA"
              fi
              ;;
          esac
