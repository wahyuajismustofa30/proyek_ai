name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON, Python, Markdown, links, and whitespace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install CI Python dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate Dependabot YAML syntax and v2 schema
        run: npx --yes @bugron/validate-dependabot-yaml@0.3.3 .github/dependabot.yml

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            python -m json.tool "$file" > /dev/null
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)

      - name: Compile Python files
        run: python -m compileall -q templates scripts

      - name: Run Markdown parser unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"

      - name: Validate internal Markdown links
        run: python scripts/check_internal_links.py

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Check whitespace errors in changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          empty_tree="$(git hash-object -t tree /dev/null)"

          case "$EVENT_NAME" in
            pull_request)
              echo "Checking pull request changes against $PR_BASE_SHA"
              git diff --check "$PR_BASE_SHA...$HEAD_SHA"
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                echo "Initial push: checking all tracked files"
                git diff --check "$empty_tree" "$HEAD_SHA"
              else
                echo "Checking pushed changes from $BEFORE_SHA to $HEAD_SHA"
                git diff --check "$BEFORE_SHA" "$HEAD_SHA"
              fi
              ;;
            *)
              if git rev-parse "$HEAD_SHA^" >/dev/null 2>&1; then
                echo "Manual run: checking the latest commit"
                git diff --check "$HEAD_SHA^" "$HEAD_SHA"
              else
                echo "No parent commit: checking all tracked files"
                git diff --check "$empty_tree" "$HEAD_SHA"
              fi
              ;;
          esac
