version: 2
updates:
  # Keep GitHub Actions pinned and updated.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Jakarta
    labels: [dependencies, github-actions]
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

