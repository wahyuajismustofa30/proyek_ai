name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Baseline quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check

      - name: Validate JSON files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path(".").rglob("*.json"))
          files = [p for p in files if ".git" not in p.parts and "node_modules" not in p.parts]
          errors = []
          for path in files:
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print(f"Validated {len(files)} JSON file(s).")
          PY

      # Configure the stack-specific steps below after choosing the project's
      # language, framework, and package manager. Keep commands in sync with
      # docs/TESTING.md and README.md.
      #
      # Node.js example:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
