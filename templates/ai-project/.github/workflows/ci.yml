name: Project CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Baseline project checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --root compares the first commit with an empty tree, so this also
      # checks every tracked file when a new project has only one commit.
      - name: Check whitespace and merge-conflict markers
        run: git diff --check --root HEAD

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "AGENTS.md"
            ".gitignore"
            "docs/PROJECT_BRIEF.md"
            "docs/ARCHITECTURE.md"
            "docs/TASKS.md"
            "docs/DECISIONS.md"
            "docs/CHANGELOG.md"
            "docs/TESTING.md"
          )

          missing=()
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              missing+=("$file")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Required project files are missing:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

          echo "All ${#required_files[@]} required project files are present."

      - name: Validate tracked JSON files
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "ls-files", "-z", "--", "*.json"],
              check=True,
              capture_output=True,
          )
          files = [
              path.decode("utf-8")
              for path in result.stdout.split(b"\0")
              if path
          ]

          errors = []
          for filename in files:
              try:
                  with open(filename, "r", encoding="utf-8") as stream:
                      json.load(stream)
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  errors.append(f"{filename}: {exc}")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)

          print(f"Validated {len(files)} tracked JSON file(s).")
          PY

      # Add stack-specific installation, lint, test, and build steps after
      # choosing the project's language and package manager. Keep them in
      # sync with docs/TESTING.md and README.md.
      #
      # Node.js example:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
      #     cache: npm
      # - run: npm ci
      # - run: npm run lint --if-present
      # - run: npm test --if-present
      # - run: npm run build --if-present
      #
      # Python example:
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      # - run: python -m pip install --upgrade pip
      # - run: pip install -e ".[test]"
      # - run: pytest
      #
      # PHP example:
      # - uses: shivammathur/setup-php@v2
      #   with:
      #     php-version: "8.3"
      # - run: composer install --no-interaction --prefer-dist
      # - run: composer test
