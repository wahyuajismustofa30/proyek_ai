name: Project CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
concurrency:
  group: project-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Static quality and secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check whitespace and conflict markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check --root HEAD
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )'; then
            echo "Merge-conflict markers found."
            exit 1
          fi
      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          required_files=("README.md" "AGENTS.md" ".gitignore" "docs/PROJECT_BRIEF.md" "docs/ARCHITECTURE.md" "docs/TASKS.md" "docs/DECISIONS.md" "docs/CHANGELOG.md" "docs/TESTING.md")
          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
      - name: Set up Python for JSON validation
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            python -m json.tool "$file" > /dev/null
            count=$((count + 1))
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)
          echo "Validated $count JSON file(s)."
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
  dependency-security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan manifests and lockfiles with OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v2.7.0
        with:
          scan-args: |-
            --recursive
            ./
  application-tests:
    name: Stack-specific tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect supported stack manifests
        id: detect
        shell: bash
        run: |
          {
            if [[ -f package.json ]]; then echo "node=true"; else echo "node=false"; fi
            if [[ -f pyproject.toml || -f requirements.txt ]]; then echo "python=true"; else echo "python=false"; fi
            if [[ -f composer.json ]]; then echo "php=true"; else echo "php=false"; fi
          } >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Node dependencies
        if: steps.detect.outputs.node == 'true'
        run: |
          test -f package-lock.json || { echo "Commit package-lock.json for reproducible npm ci."; exit 1; }
          npm ci
      - name: Run Node lint, tests, and build
        if: steps.detect.outputs.node == 'true'
        run: |
          node -e "const p=require('./package.json'); if (!p.scripts?.test) { console.error('Add a test script to package.json'); process.exit(1) }"
          npm run lint --if-present
          npm test
          npm run build --if-present
      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Python project and test dependencies
        if: steps.detect.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          if [[ -f pyproject.toml ]]; then
            python -m pip install -e ".[test]"
          else
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest
      - name: Run Python tests
        if: steps.detect.outputs.python == 'true'
        run: python -m pytest
      - name: Set up PHP
        if: steps.detect.outputs.php == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Install PHP dependencies
        if: steps.detect.outputs.php == 'true'
        run: |
          test -f composer.lock || { echo "Commit composer.lock for reproducible installs."; exit 1; }
          composer validate --strict
          composer install --no-interaction --prefer-dist
      - name: Run PHP tests
        if: steps.detect.outputs.php == 'true'
        run: |
          composer run-script --list | grep -qE '(^|[[:space:]])test([[:space:]]|$)' || { echo "Define a Composer test script."; exit 1; }
          composer run-script test --no-interaction
      - name: Report when no application stack is configured
        if: steps.detect.outputs.node != 'true' && steps.detect.outputs.python != 'true' && steps.detect.outputs.php != 'true'
        run: echo "::notice::No Node.js, Python, or PHP manifest detected. Static and security checks ran; application tests are not applicable yet."
